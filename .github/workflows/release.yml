name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Publish Windows executable
        shell: pwsh
        run: >-
          dotnet publish ./src/XIVLauncherProxy/XIVLauncherProxy.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output ./publish

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./publish/XIVLauncherProxy.exe -Algorithm SHA256).Hash
          "$hash  XIVLauncherProxy.exe" | Set-Content ./publish/XIVLauncherProxy.exe.sha256 -Encoding ascii

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/XIVLauncherProxy.exe
            publish/XIVLauncherProxy.exe.sha256
