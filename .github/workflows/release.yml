name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: python scripts/verify_release_notes.py --tag "$env:GITHUB_REF_NAME"

      - name: Publish Windows executable
        shell: pwsh
        run: >-
          dotnet publish ./src/XIVLauncherProxy.Desktop/XIVLauncherProxy.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output ./publish

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./publish/XIVLauncherProxy.exe -Algorithm SHA256).Hash
          "$hash  XIVLauncherProxy.exe" | Set-Content ./publish/XIVLauncherProxy.exe.sha256 -Encoding ascii

      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $notesOut = "build/release/release-notes.md"
          New-Item -ItemType Directory -Force -Path (Split-Path $notesOut) | Out-Null
          $exeHash = (Get-FileHash ./publish/XIVLauncherProxy.exe -Algorithm SHA256).Hash
          $lines = @(
            (Get-Content "./docs/release-notes/$env:GITHUB_REF_NAME.md" -Raw).TrimEnd(),
            "",
            "## 构建信息",
            "",
            "| 项目 | 值 |",
            "| --- | --- |",
            "| 版本 | ``$env:GITHUB_REF_NAME`` |",
            "| XIVLauncherProxy.exe SHA-256 | ``$exeHash`` |"
          )
          Set-Content -Path $notesOut -Value ($lines -join "`n") -Encoding utf8

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: build/release/release-notes.md
          files: |
            publish/XIVLauncherProxy.exe
            publish/XIVLauncherProxy.exe.sha256
